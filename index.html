<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d0a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>灰色の契約 GREY CONTRACT</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: full-screen low-res 3D canvas + pixel HUD canvas; hub screens live in one side dock over the live 3D hangar (deliberately single dark look) */
:root{
  --bg:#0b0d0a; --panel:rgba(12,16,11,.94); --dock:rgba(10,13,9,.95); --fg:#e6e0c6; --hud:#9ef07c;
  --amber:#f2b84b; --line:#3d4a33; --dim:#8f9880; --red:#ff4b3a; --cyan:#7fd8ff;
  --px:"DotGothic16","MS Gothic","Osaka-Mono",monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;font-family:var(--px);-webkit-user-select:none;user-select:none;touch-action:none}
[hidden]{display:none!important}
#wrap{position:fixed;inset:0;background:var(--bg)}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#hud{pointer-events:none}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,8,5,.72);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;overflow:auto;touch-action:pan-y}
.panel{width:100%;max-width:600px;background:var(--panel);border:1px solid var(--line);padding:22px 24px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
#title{background:linear-gradient(90deg,rgba(6,8,5,.85),rgba(6,8,5,.2));justify-content:flex-start}
#title .panel{background:transparent;border:none;max-width:520px}
.logo{font-size:clamp(44px,11vw,84px);line-height:1;color:#cfcbbd;letter-spacing:.04em;text-shadow:4px 4px 0 #2a2c26}
.logo small{display:block;font-size:.24em;color:var(--amber);letter-spacing:.42em;margin-top:14px;text-shadow:2px 2px 0 #5a3a0a}
.tmenu{display:flex;flex-direction:column;gap:10px;align-items:flex-start;margin-top:8px}
.ver{font-size:11px;color:var(--dim);letter-spacing:.2em}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font-family:var(--px);font-size:17px;background:transparent;color:var(--amber);border:1px solid var(--amber);padding:9px 18px;cursor:pointer}
.btn:hover:not(:disabled),.btn[aria-pressed="true"]{background:var(--amber);color:var(--bg)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.warn{color:var(--red);border-color:var(--red)}
.btn.warn:hover{background:var(--red);color:var(--bg)}
.btn:focus-visible,.pitem:focus-visible,.tab:focus-visible,.mbtn:focus-visible,input:focus-visible{outline:2px solid var(--hud);outline-offset:2px}
.btn.sub{font-size:13px;color:var(--dim);border-color:var(--line);padding:6px 12px}
.btn.sub[aria-pressed="true"]{background:var(--line);color:var(--fg)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;color:var(--dim)}
.keys b{color:var(--fg);font-weight:normal}
.lbl{font-size:12px;color:var(--dim);letter-spacing:.14em}
.field{display:flex;flex-direction:column;gap:6px}
input[type=text]{font-family:var(--px);font-size:16px;background:rgba(0,0,0,.3);color:var(--fg);border:1px solid var(--line);padding:9px 10px;-webkit-user-select:text;user-select:text;touch-action:manipulation}
input[type=range]{accent-color:var(--hud);width:100%}
table.rw{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
table.rw td{padding:4px 0;border-bottom:1px dotted var(--line)}
table.rw td:last-child{text-align:right}
table.rw tr.tot td{color:var(--amber);font-size:19px;border-bottom:none;padding-top:10px}
.big{font-size:34px;letter-spacing:.1em}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rank{font-size:64px;line-height:1;color:var(--amber);text-shadow:3px 3px 0 #5a3a0a}
.rank small{display:block;font-size:11px;color:var(--dim);letter-spacing:.2em;text-shadow:none;text-align:center}
.ok{color:var(--hud)} .ng{color:var(--red)} .am{color:var(--amber)}
.note{font-size:13px;color:var(--cyan)}

/* hub dock */
#dock{position:absolute;left:0;top:0;bottom:0;width:min(450px,100%);background:var(--dock);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:10px;box-sizing:border-box;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;padding-block:16px}
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.ghead .t{font-size:22px;color:var(--amber);letter-spacing:.08em;min-width:0;overflow-wrap:anywhere}
.ghead .cr{font-size:16px;font-variant-numeric:tabular-nums}
.sub2{font-size:12px;color:var(--dim);letter-spacing:.06em}
.crumb{font-size:12px;color:var(--hud);letter-spacing:.2em}
.mlist{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.mbtn{font-family:var(--px);text-align:left;cursor:pointer;background:transparent;color:var(--fg);border:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.mbtn b{font-weight:normal;font-size:20px;color:var(--amber);letter-spacing:.08em}
.mbtn span{font-size:12px;color:var(--dim)}
.mbtn:hover{border-color:var(--amber);background:rgba(242,184,75,.06)}
.mbtn em{font-style:normal;font-size:12px;background:var(--red);color:var(--bg);padding:1px 6px;margin-left:8px;vertical-align:middle}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tab{font-family:var(--px);font-size:13px;background:transparent;color:var(--dim);border:1px solid var(--line);padding:5px 9px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--hud);color:var(--bg);border-color:var(--hud)}
.plist{flex:1 1 0;min-height:60px;overflow:auto;display:flex;flex-direction:column;gap:6px;touch-action:pan-y}
.pitem{font-family:var(--px);text-align:left;cursor:pointer;background:transparent;color:var(--fg);border:1px solid var(--line);padding:8px 10px;
  display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:baseline}
.pitem:hover{border-color:var(--dim)}
.pitem.eq{border-color:var(--hud);background:rgba(158,240,124,.07)}
.pitem.sel{border-color:var(--amber);background:rgba(242,184,75,.08)}
.pitem.lock{opacity:.45;cursor:default}
.pitem .nm{font-size:15px;min-width:0}
.pitem .pr{font-size:13px;color:var(--amber);font-variant-numeric:tabular-nums}
.pitem.eq .pr{color:var(--hud)}
.pitem .pr.no,.pr .no{color:var(--red)}
.pitem .st{grid-column:1/-1;font-size:12px;color:var(--dim);line-height:1.5}
.pitem.unread .nm::before{content:"●";color:var(--red);margin-right:6px;font-size:10px;vertical-align:middle}
.sw{display:inline-flex;gap:3px;vertical-align:middle;margin-right:6px}
.sw i{width:12px;height:12px;display:inline-block;border:1px solid var(--line)}
.detail{flex:0 1 auto;max-height:46%;overflow:auto;border-top:1px dashed var(--line);padding-top:10px;font-size:14px;line-height:1.75;touch-action:pan-y}
.detail p{margin:0 0 8px;max-width:60ch}
.detail .h{color:var(--hud);font-size:12px;letter-spacing:.12em}
.dl{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:13px;font-variant-numeric:tabular-nums}
.dl span{color:var(--dim)}
.gstats{border-top:1px dashed var(--line);padding-top:10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px;font-size:13px;font-variant-numeric:tabular-nums}
.gstats div{display:flex;justify-content:space-between;gap:8px;min-width:0}
.gstats span{color:var(--dim)}
.gstats .full{grid-column:1/-1}
.lbar{grid-column:1/-1;height:8px;border:1px solid var(--line);position:relative}
.lbar i{position:absolute;left:1px;top:1px;bottom:1px;background:var(--hud)}
.lbar.over i{background:var(--red)}
.gnote{font-size:12px;color:var(--red);min-height:1em}
.gnote.ok{color:var(--hud)}
.sysbox{flex:1 1 0;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px;touch-action:pan-y}
.srow{display:flex;flex-direction:column;gap:6px}
.srow .v{font-variant-numeric:tabular-nums;color:var(--fg)}
.padfocus{outline:2px solid var(--hud)!important;outline-offset:2px}
.kgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);gap:6px 8px;align-items:center;font-size:13px}
.kgrid.two{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}
.kgrid .kh{font-size:11px;color:var(--dim);letter-spacing:.1em}
.kslot{font-family:var(--px);font-size:13px;background:transparent;color:var(--fg);border:1px solid var(--line);padding:6px 4px;cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kslot:hover{border-color:var(--amber)}
.kslot.wait{border-color:var(--amber);background:var(--amber);color:var(--bg)}
@media (max-width:760px){
  #dock{top:auto;height:62%;width:100%;border-right:none;border-top:1px solid var(--line);padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(12px + env(safe-area-inset-bottom,0px))}
  #dock.tall{height:78%}
  #title{background:rgba(6,8,5,.6);justify-content:center}
}

/* touch */
#touch{position:absolute;inset:0}
#look{position:absolute;right:0;top:0;width:58%;height:100%}
#stick{position:absolute;left:max(24px,env(safe-area-inset-left,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;border:2px solid rgba(158,240,124,.45);background:rgba(158,240,124,.06)}
#knob{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:rgba(158,240,124,.35)}
#btns{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(2,70px);gap:8px}
#btns button{font-family:var(--px);height:54px;font-size:14px;color:var(--hud);background:rgba(10,14,9,.45);border:1px solid rgba(158,240,124,.5);border-radius:10px;touch-action:none}
#btns button.on{background:rgba(158,240,124,.35);color:var(--bg)}
#btns #tbQB{color:var(--amber);border-color:rgba(242,184,75,.6)}
#btns #tbBlade{color:var(--cyan);border-color:rgba(127,216,255,.6)}
#pauseBtn{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));font-family:var(--px);font-size:13px;color:var(--hud);background:rgba(10,14,9,.5);border:1px solid rgba(158,240,124,.5);padding:6px 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="wrap">
  <canvas id="gl"></canvas>
  <canvas id="hud"></canvas>

  <div id="touch" hidden>
    <div id="look"></div>
    <div id="stick"><div id="knob"></div></div>
    <div id="btns">
      <button id="tbBlade">左腕</button><button id="tbMsl">背部</button>
      <button id="tbQB">QB</button><button id="tbFire">射撃</button>
      <button id="tbDash">ダッシュ</button><button id="tbJump">上昇</button>
    </div>
    <button id="pauseBtn">II</button>
  </div>

  <div class="screen" id="title">
    <div class="panel">
      <div class="logo">灰色の契約<small>GREY CONTRACT</small></div>
      <div class="tmenu" id="tmenu"></div>
      <div class="ver">傭兵機動兵器シミュレーション ／ 試作版 0.4</div>
    </div>
  </div>

  <div class="screen" id="boot" hidden>
    <div class="panel">
      <div class="crumb">傭兵管理局 ── 新規登録</div>
      <div class="big">傭兵登録</div>
      <div class="field"><label class="lbl" for="inPilot">パイロット名</label><input type="text" id="inPilot" maxlength="12" placeholder="例：カラス" autocomplete="off"></div>
      <div class="field"><label class="lbl" for="inAC">機体名</label><input type="text" id="inAC" maxlength="14" placeholder="例：アイアンクロウ" autocomplete="off"></div>
      <div class="row"><button class="btn" id="bootOk">登録する</button><button class="btn sub" id="bootBack" data-back>戻る</button></div>
    </div>
  </div>

  <div id="dock" hidden></div>

  <div class="screen" id="pause" hidden>
    <div class="panel">
      <div class="big">一時停止</div>
      <div class="row"><button class="btn" id="resumeBtn" data-back>再開</button><button class="btn sub" id="quitBtn">ミッション放棄</button></div>
    </div>
  </div>

  <div class="screen" id="result" hidden>
    <div class="panel">
      <div class="rhead"><div><div class="crumb" id="resName"></div><div class="big" id="resTitle">任務完了</div></div><div class="rank" id="resRank"></div></div>
      <table class="rw" id="resTable"></table>
      <div class="note" id="resNote"></div>
      <div class="row"><button class="btn" id="toMenuBtn" data-back>メニューへ</button><button class="btn sub" id="retryBtn">同じ依頼を再出撃</button></div>
    </div>
  </div>
</div>

/* ================= save ================= */
const SKEY='irondust-save-v2',OLDKEY='irondust-save-v1';
function freshSave(){return {pilot:'',acName:'',cr:20000,owned:['HD-A','CR-A','AR-A','LG-B','RF','MS','LB-0','LB-10','BS-A','GN-A'],
  eq:{head:'HD-A',core:'CR-A',arms:'AR-A',legs:'LG-B',rw:'RF',lw:'LB-10',bw:'MS',boost:'BS-A',gen:'GN-A',color:0,opts:[]},prog:0,cleared:{},mails:[],arena:{rank:11},settings:defSettings()};}
let save=freshSave();
try{const s=JSON.parse(localStorage.getItem(SKEY));if(s&&s.eq&&Array.isArray(s.owned))save=Object.assign(freshSave(),s);}catch(e){}
try{if(!save.pilot){const o=JSON.parse(localStorage.getItem(OLDKEY));if(o&&o.eq){save.cr=Math.max(save.cr,o.cr|0);save.owned=[...new Set(save.owned.concat(o.owned||[]))];Object.assign(save.eq,o.eq);}}}catch(e){}
if(!save.arena)save.arena={rank:11};
if(!Array.isArray(save.eq.opts))save.eq.opts=[];
while(save.prog<MISSIONS.length-1&&save.cleared[MISSIONS[save.prog].id])save.prog++;
for(const [k,v] of [['lw','LB-10'],['boost','BS-A'],['gen','GN-A']]){if(!save.eq[k])save.eq[k]=v;if(!save.owned.includes(v))save.owned.push(v);}
function normSettings(){const s=save.settings=Object.assign(defSettings(),save.settings||{});s.keys=Object.assign(defSettings().keys,s.keys||{});for(const a in DEF_KEYS)if(!Array.isArray(s.keys[a])||s.keys[a].length!==2)s.keys[a]=DEF_KEYS[a].slice();s.pad=Object.assign({},DEF_PAD,s.pad||{});}
normSettings();
function persist(){try{localStorage.setItem(SKEY,JSON.stringify(save));}catch(e){}}
function addMail(id){if(!save.mails.some(m=>m.id===id))save.mails.unshift({id,read:false});}
const fillT=s=>esc(s).replace(/\{P\}/g,esc(save.pilot)).replace(/\{A\}/g,esc(save.acName));

function calcStats(eq){
  const h=pt('head',eq.head),c=pt('core',eq.core),a=pt('arms',eq.arms),l=pt('legs',eq.legs),b=pt('bw',eq.bw),bo=pt('boost',eq.boost),g=pt('gen',eq.gen);

function initAudio(){

  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=save.settings.vol*0.7;master.connect(AC.destination);
    nbuf=AC.createBuffer(1,AC.sampleRate*1.5|0,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;

    boostG=AC.createGain();boostG.gain.value=0;s.connect(f);f.connect(boostG);boostG.connect(master);s.start();

function nz(dur,freq,vol){
  if(!AC||vol<0.005)return;const t=AC.currentTime,s=AC.createBufferSource();s.buffer=nbuf;
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(freq,t);f.frequency.exponentialRampToValueAtTime(Math.max(50,freq*0.2),t+dur);

}

function yawTo(from,to){return Math.atan2(-(to.x-from.x),-(to.z-from.z));}

function los(from,to,tol){const d=tmp.copy(to).sub(from);const L=d.length();d.normalize();return rayCast(from,d,L,false).t>=L-(tol||0.5);}
function tgtFor(e){

  return {pos:P.pos,c:playerCenter(),v:P.vel,gen:false};
}

function updateEnemies(dt,time){
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(!e.alive){
      if(e.dying>0){
        e.dying-=dt;e.pos.y-=dt*(14+(1.6-e.dying)*10);e.g.rotation.y+=dt*6;e.rot.rotation.y+=dt*10;
        if(Math.random()<0.5)part(e.pos,{mat:matSmoke,life:1,s:1.2,grow:2,v:new V3(0,2,0)});
        if(e.dying<=0||e.pos.y<=1||inBld(e.pos)){boom(e.pos,5);scene.remove(e.g);enemies.splice(i,1);}
      }else if(e.smoke>0){e.smoke-=dt;if(Math.random()<dt*6)part(e.center(),{mat:matSmoke,life:2.2,s:1,grow:3,v:new V3(0.6,4,0)});}
      continue;
    }
    if(e.type==='ac'||e.type==='mt'){updateAC(e,dt);continue;}
    const T=tgtFor(e),dist=Math.hypot(T.pos.x-e.pos.x,T.pos.z-e.pos.z),act=(P.alive||T.gen);
    if(e.type==='tank'){
      if(act&&(e.goal||dist<175)){
        const want=yawTo(e.pos,T.pos);e.yaw+=clamp(angDiff(e.yaw,want),-dt*0.9,dt*0.9);e.g.rotation.y=e.yaw;
        e.tur.rotation.y=angDiff(e.yaw,want);
        const sp=dist>(T.gen?40:48)?6:dist<(T.gen?22:30)?-3:0;
        e.vel.set(-Math.sin(e.yaw)*sp,0,-Math.cos(e.yaw)*sp);e.pos.addScaledVector(e.vel,dt);collide(e.pos,e.vel,3.4);
        e.cd-=dt;
        if(e.cd<=0&&dist<155){
          const from=new V3(e.pos.x,e.pos.y+2.4,e.pos.z);
          if(los(from,T.c,T.gen?8:0.5)){
            const dir=lead(from,78,0.7,T).sub(from).normalize();from.addScaledVector(dir,4);
            spawnShot({p:from,v:dir.multiplyScalar(78),dmg:240,foe:true,kind:'s',life:3});sfx.shell(e.pos);e.cd=2.6+Math.random()*1.2;
          }else e.cd=0.6;
        }
      }else e.vel.set(0,0,0);
    }else if(e.type==='heli'){
      e.rot.rotation.y+=dt*22;
      if(act&&(e.goal||dist<230)){
        e.ang+=dt*0.33*e.dir;const R=T.gen?45:62;
        const tx=T.pos.x+Math.cos(e.ang)*R,tz=T.pos.z+Math.sin(e.ang)*R,ty=24+Math.sin(time*0.7+i)*4+T.pos.y*0.5;
        const dx=tx-e.pos.x,dy=ty-e.pos.y,dz=tz-e.pos.z,L=Math.hypot(dx,dy,dz)||1,sp=Math.min(20,L*1.5);
        e.vel.set(dx/L*sp,dy/L*sp,dz/L*sp);e.pos.addScaledVector(e.vel,dt);
        e.pos.x=clamp(e.pos.x,-LIM,LIM);e.pos.z=clamp(e.pos.z,-LIM,LIM);
        e.g.rotation.y=yawTo(e.pos,T.pos);e.g.rotation.z=Math.sin(time+i)*0.1;e.g.rotation.x=-0.12;
        e.cd-=dt;if(e.cd<=0&&dist<170){e.burst=6;e.cd=3.6+Math.random()*1.5;}
        if(e.burst>0){e.bt-=dt;if(e.bt<=0){e.bt=0.1;e.burst--;
          const from=new V3(e.pos.x,e.pos.y-1,e.pos.z),dir=lead(from,135,0.8,T).sub(from).normalize();

const KB=()=>save.settings.keys;
const keys={};let mslReq=false,bladeReq=false,qbReq=false,bindWait=null,swallowClick=false;

const PAD={on:false,id:'',b:[],prev:[],ax:[0,0,0,0],blocked:false,navDir:'',navT:0};
const bound=(a,c)=>!!c&&KB()[a].includes(c);
const padDown=i=>!!PAD.b[i],padHit=i=>!!PAD.b[i]&&!PAD.prev[i];
function held(a){
  if(KB()[a].some(c=>c&&keys[c]))return true;
  if(PAD.on&&PAD_ACTS.includes(a)&&padDown(save.settings.pad[a]))return true;

}
function keyName(c){
  if(!c)return '─';
  const map={Mouse0:'左クリック',Mouse1:'中クリック',Mouse2:'右クリック',Mouse3:'マウス4',Mouse4:'マウス5',Space:'Space',ShiftLeft:'左Shift',ShiftRight:'右Shift',
    ControlLeft:'左Ctrl',ControlRight:'右Ctrl',AltLeft:'左Alt',AltRight:'右Alt',ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→',Escape:'Esc',Enter:'Enter',Tab:'Tab',CapsLock:'CapsLock'};
  if(map[c])return map[c];if(c.startsWith('Key'))return c.slice(3);if(c.startsWith('Digit'))return c.slice(5);if(c.startsWith('Numpad'))return 'テンキー'+c.slice(6);
  return c;
}
const padName=i=>i==null||i<0?'─':(PADN[i]||('ボタン'+i));
const actName=a=>(ACTIONS.find(x=>x[0]===a)||[a,a])[1];
function assignKey(code){
  const K=KB(),{action,slot}=bindWait;
  if(code)for(const a in K)K[a]=K[a].map(c=>c===code?'':c);
  K[action][slot]=code;bindWait=null;persist();sfx.buy();
}
function assignPad(i){
  const Pd=save.settings.pad,a=bindWait.action,old=Pd[a];
  for(const k of PAD_ACTS)if(k!==a&&Pd[k]===i)Pd[k]=old;
  Pd[a]=i;bindWait=null;persist();sfx.buy();
}
function pressEdge(code){
  if(state!=='play')return;
  if(bound('pause',code)){pause();return;}
  if(bound('bw',code))mslReq=true;
  if(bound('qb',code))qbReq=true;
}
addEventListener('keydown',e=>{
  if(bindWait&&bindWait.kind==='key'){
    e.preventDefault();e.stopPropagation();
    if(e.code==='Escape'){bindWait=null;sfx.back();}else if(e.code==='Backspace'||e.code==='Delete')assignKey('');else assignKey(e.code);
    renderHub();return;
  }
  if(e.target&&e.target.tagName==='INPUT'&&e.target.type==='text')return;
  keys[e.code]=true;
  if(state==='play'){
    if(!e.repeat)pressEdge(e.code);
    if(e.code==='Space'||Object.values(KB()).some(v=>v.includes(e.code)))e.preventDefault();
  }else if(state==='hub'&&e.code==='Escape'){const b=dock.querySelector('[data-back]')||dock.querySelector('[data-act="menu"]');if(b)b.click();}
},true);
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});

  P.en-=L.en;st.cd=L.cd;P.slash=SLASH;P.slashSide=side;P.bladeW=L;P.slashed=false;P.lungeTgt=null;
  const pc=playerCenter();let best=1e9;

    const dir=c.clone().sub(pc);const fl=Math.hypot(dir.x,dir.z)||1;const dot=(dir.x*fwd.x+dir.z*fwd.z)/fl;if(dot<0.55)continue;

    const dir=c.clone().sub(pc);const fl=Math.hypot(dir.x,dir.z)||1;if((dir.x*fwd.x+dir.z*fwd.z)/fl<0.1&&d>2)continue;

const CAMD=15;
function updateCamera(dt){
  const d=new V3(-Math.sin(P.yaw)*Math.cos(P.pitch),Math.sin(P.pitch),-Math.cos(P.yaw)*Math.cos(P.pitch));
  const tgt=new V3(P.pos.x,P.pos.y+5.2,P.pos.z);
  camera.position.copy(tgt).addScaledVector(d,-CAMD);camera.position.y+=3.6;
  if(camera.position.y<1.5)camera.position.y=1.5;
  camera.lookAt(tmp.copy(tgt).addScaledVector(d,45).add(new V3(0,3.6,0)));
  if(shake>0){camera.position.x+=(Math.random()-.5)*shake;camera.position.y+=(Math.random()-.5)*shake;shake=Math.max(0,shake-dt*2.2);}
  const cd=new V3();camera.getWorldDirection(cd);
  const o=camera.position.clone().addScaledVector(cd,CAMD);

}
function updateLocks(dt){
  const w=hud.width,h=hud.height,list=[],HD={lockR:S.lockR,lockT:S.lockT};let best=1e9;rifleT=null;
  for(const e of enemies){
    e.onScreen=false;if(!e.alive){e.lock=0;continue;}
    const c=e.center(),dist=c.distanceTo(P.pos);c.project(camera);
    if(c.z<1&&Math.abs(c.x)<1&&Math.abs(c.y)<1){e.onScreen=true;e.sx=(c.x+1)/2*w;e.sy=(1-c.y)/2*h;}
    const inBox=e.onScreen&&Math.abs(c.x)<0.36*S.boxMul&&Math.abs(c.y)<0.44*S.boxMul&&dist<HD.lockR&&P.alive;
    if(inBox){
      const sd=Math.hypot(c.x,c.y*0.8);if(sd<best&&dist<200){best=sd;rifleT=e;}

  if(curM.arena){const o=arenaOpp(curM.arena);say(`${o.pilot}「${o.line}」`,3.5,'#f2b84b');}
  else say(save.acName+'、作戦を開始する',3);
  if(curM.obj==='boss'&&!curM.arena)setTimeout(()=>{if(state==='play'&&!outcome){say('敵AC「'+enemies.find(e=>e.isBoss).cfg.name+'」を確認',3,'#ff4b3a');sfx.alarm();}},2600);
}
function endMission(o){if(outcome)return;outcome=o;endTimer=o==='win'?3:2.8;if(o==='win')say('任務完了',3,'#f2b84b');}
function objRemain(){
  const m=curM;
  if(m.obj==='targets')return enemies.filter(e=>e.alive&&e.target).length;
  if(m.obj==='boss')return enemies.filter(e=>e.alive&&e.isBoss).length;
  return enemies.filter(e=>e.alive).length;
}
function updateMission(dt){
  missionT+=dt;const m=curM;
  if(m.waves){
    while(waveIdx<m.waves.length&&missionT>=m.waves[waveIdx].t){
      const wv=m.waves[waveIdx];waveIdx++;
      for(const [type,n] of wv.list)for(let i=0;i<n;i++){const a=Math.random()*6.28,r=160+Math.random()*50;
        let p=new V3(Math.cos(a)*r,0,Math.sin(a)*r);for(let k=0;k<30&&nearBld(p.x,p.z,6);k++){const b=Math.random()*6.28;p.set(Math.cos(b)*r,0,Math.sin(b)*r);}
        spawnOne(type,{pos:p,goal:Math.random()<0.65});}
      say(`第${waveIdx}波 接近`,2.5,'#ff4b3a');sfx.alarm();
    }
  }
  if(!outcome){
    if(m.limit&&missionT>=m.limit){say('作戦時間切れ',3,'#ff4b3a');endMission('fail');}
    else if(m.obj==='defend'){if(waveIdx>=m.waves.length&&objRemain()===0)endMission('win');}
    else if(objRemain()===0)endMission('win');
  }
  if(GEN&&GEN.flash>0)GEN.flash-=dt;
  if(endTimer>0){endTimer-=dt;if(endTimer<=0)showResult();}
}

function partStats(cat,p){
  if(cat==='head')return `AP ${p.ap} ／ 重量 ${p.w} ／ ロック距離 ${p.lockR} ／ ロック時間 ${p.lockT}秒`;
  if(cat==='core')return `AP ${p.ap} ／ 重量 ${p.w} ／ EN容量 ${p.en}`;
  if(cat==='arms'&&p.wa)return `AP ${p.ap} ／ 重量 ${p.w} ／ 威力 ${p.wa.dmg} ／ ${p.wa.en?'EN消費 '+p.wa.en+'/発':'弾数 '+p.wa.ammo+' ／ 弾単価 '+p.wa.cost+' cr'}`;
  if(cat==='arms')return `AP ${p.ap} ／ 重量 ${p.w}`+(p.rate<1?` ／ 連射+${Math.round((1-p.rate)*100)}%`:p.rate>1?` ／ 連射-${Math.round((p.rate-1)*100)}%`:'')+(p.blade>1?' ／ ブレード威力+35%':'');
  if(cat==='boost')return `重量 ${p.w} ／ 速度 ×${p.dash} ／ QB出力 ${p.qb} ／ QB消費EN ${p.qbEn}`;
  if(cat==='gen')return `重量 ${p.w} ／ EN容量 ${p.en>=0?'+':''}${p.en} ／ EN回復 ×${p.regen}`;
  if(cat==='legs')return `AP ${p.ap} ／ 積載 ${p.load} ／ 速度 ${p.walk*12} km/h ／ ジャンプ ${p.jump}`;
  if((cat==='rw'||cat==='lw')&&!isBlade(p)&&p.id!=='LB-0')return p.en?`威力 ${p.dmg} ／ EN消費 ${p.en}/発 ／ 重量 ${p.w} ／ 弾薬費なし`:`威力 ${p.dmg}${p.pellets?'×'+p.pellets:''} ／ 弾数 ${p.ammo} ／ 重量 ${p.w} ／ 弾単価 ${p.cost} cr`;
  if(cat==='bw'&&p.kind==='radar')return `重量 ${p.w} ／ 索敵範囲 ×${p.radar} ／ ロック距離 ×${p.lockMul}`;
  if(cat==='bw'&&p.en)return `威力 ${p.dmg} ／ EN消費 ${p.en}/発 ／ 重量 ${p.w} ／ 弾薬費なし`;
  if(cat==='bw'&&p.kind==='auto')return `威力 ${p.dmg}×${p.burst}連射 ／ 弾数 ${p.ammo} ／ 重量 ${p.w} ／ 弾単価 ${p.cost} cr`;
  if(cat==='opt')return `重量 ${p.w}`;
  if(cat==='rw'||cat==='lw')return p.dmg?`威力 ${p.dmg} ／ 間合い ${p.range} ／ EN消費 ${p.en} ／ 重量 ${p.w}`:'重量 0';
  return `威力 ${p.dmg} ／ 弾数 ${p.ammo} ／ ${p.locks?'最大ロック '+p.locks:'ロックなし'} ／ 重量 ${p.w} ／ 弾単価 ${p.cost} cr`;
}

dock.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act;
  if(a!=='wipe')wipeArm=false;
  if(a!=='kslot'&&a!=='pslot')bindWait=null;
  switch(a){
    case 'menu':sfx.back();curM=null;hubView='menu';break;
    case 'missions':sfx.click();hubView='missions';break;
    case 'garage':sfx.click();curM=null;gNote='';hubView='garage';break;
    case 'mail':sfx.click();hubView='mail';break;
    case 'system':sfx.click();hubView='system';break;
    case 'title':sfx.back();openTitle();return;
    case 'selm':sfx.click();selM=MISSIONS.find(m=>m.id===b.dataset.id);break;
    case 'accept':sfx.buy();curM=selM;gNote='';hubView='garage';break;
    case 'selmail':sfx.click();selMail=b.dataset.id;break;
    case 'res':sfx.click();save.settings.res=+b.dataset.v;resize();persist();break;
    case 'wipe':
      if(!wipeArm){wipeArm=true;sfx.warn();break;}
      try{localStorage.removeItem(SKEY);localStorage.removeItem(OLDKEY);}catch(err){}
      save=freshSave();wipeArm=false;curM=null;selM=null;selMail=null;rebuildPlayer();openTitle();return;
    case 'tab':sfx.click();gTab=b.dataset.tab;gNote='';break;
    case 'opt':{const o=OPTS.find(x=>x.id===b.dataset.id);gNote='';gNoteOk=false;let bought=false;
      if(!save.owned.includes(o.id)){
        if(o.req&&!save.cleared[o.req]){gNote='このパーツはまだ入荷していません。依頼をこなすと入荷します。';sfx.deny();break;}
        if(save.cr<o.price){gNote=`${o.name} を買うには ${fmt(o.price-save.cr)} cr 足りません。`;sfx.deny();break;}
        save.cr-=o.price;save.owned.push(o.id);gNote=`${o.name} を購入しました。`;gNoteOk=true;bought=true;sfx.buy();}
      const L=save.eq.opts||(save.eq.opts=[]),ix=L.indexOf(o.id);

      else{L.push(o.id);if(!bought)sfx.click();}
      break;}
    case 'keys':sfx.click();hubView='keys';break;
    case 'arena':sfx.click();curM=null;selA=null;hubView='arena';break;
    case 'sela':sfx.click();selA=arenaOpp(+b.dataset.r);break;
    case 'challenge':sfx.buy();curM=arenaMission(selA);gNote='';hubView='garage';break;
    case 'pad':sfx.click();hubView='pad';break;
    case 'invY':sfx.click();save.settings.invY=!save.settings.invY;persist();break;
    case 'kslot':{const a2=b.dataset.a,s2=+b.dataset.s;sfx.click();bindWait=(bindWait&&bindWait.kind==='key'&&bindWait.action===a2&&bindWait.slot===s2)?null:{kind:'key',action:a2,slot:s2};break;}
    case 'pslot':{const a2=b.dataset.a;sfx.click();bindWait=(bindWait&&bindWait.kind==='pad'&&bindWait.action===a2)?null:{kind:'pad',action:a2};break;}
    case 'kdef':sfx.click();save.settings.keys=JSON.parse(JSON.stringify(DEF_KEYS));persist();break;
    case 'pdef':sfx.click();save.settings.pad=Object.assign({},DEF_PAD);persist();break;
    case 'color':sfx.click();save.eq.color=+b.dataset.i;rebuildPlayer();break;
    case 'part':{
      const p=pt(gTab,b.dataset.id);gNote='';gNoteOk=false;
      if(!save.owned.includes(p.id)&&p.req&&!save.cleared[p.req]){gNote='このパーツはまだ入荷していません。依頼をこなすと入荷します。';sfx.deny();break;}
      if(!save.owned.includes(p.id)){
        if(save.cr<p.price){gNote=`${p.name} を買うには ${fmt(p.price-save.cr)} cr 足りません。`;sfx.deny();break;}
        save.cr-=p.price;save.owned.push(p.id);gNote=`${p.name} を購入しました。`;gNoteOk=true;sfx.buy();
      }else sfx.click();

    case 'sortie':sortie();return;

const HG='#9ef07c',HA='#f2b84b',HR='#ff4b3a',HC='#7fd8ff';
function bar(x,y,w,h,f,c){hx.strokeStyle=c;hx.strokeRect(x,y,w,h);hx.fillStyle=c;hx.fillRect(x+2,y+2,Math.max(0,(w-4)*clamp(f,0,1)),h-4);}
const mmss=t=>{t=Math.max(0,t|0);return String(t/60|0).padStart(2,'0')+':'+String(t%60).padStart(2,'0');};
function drawHUD(time){
  const w=hud.width,h=hud.height,u=h/480;hx.clearRect(0,0,w,h);
  if(state!=='play'&&state!=='paused')return;
  const F=s=>`${Math.round(s*u)}px "DotGothic16", monospace`;
  hx.lineWidth=Math.max(1,Math.round(u*1.5));hx.textBaseline='top';
  if(hitFlash>0){hx.fillStyle=`rgba(255,40,20,${hitFlash*0.45})`;hx.fillRect(0,0,w,h);}
  const apc=P.ap/P.max<0.3?HR:HG;
  hx.textAlign='center';hx.fillStyle=apc;hx.font=F(24);hx.fillText('AP  '+Math.ceil(P.ap),w/2,12*u);
  bar(w/2-90*u,42*u,180*u,7*u,P.ap/P.max,apc);
  const cx=w/2,cy=h/2,bw=0.36*S.boxMul*w/2,bh=0.44*S.boxMul*h/2,cl=14*u;
  hx.strokeStyle='rgba(158,240,124,.55)';hx.beginPath();
  for(const [sx,sy] of [[-1,-1],[1,-1],[1,1],[-1,1]]){const x=cx+sx*bw,y=cy+sy*bh;hx.moveTo(x,y-sy*cl);hx.lineTo(x,y);hx.lineTo(x-sx*cl,y);}
  hx.stroke();
  hx.strokeStyle=HG;hx.beginPath();hx.moveTo(cx-12*u,cy);hx.lineTo(cx-4*u,cy);hx.moveTo(cx+4*u,cy);hx.lineTo(cx+12*u,cy);
  hx.moveTo(cx,cy-12*u);hx.lineTo(cx,cy-4*u);hx.moveTo(cx,cy+4*u);hx.lineTo(cx,cy+12*u);hx.stroke();
  if(hitMark>0){hx.strokeStyle='#ffffff';hx.beginPath();const a=7*u,b=16*u;
    hx.moveTo(cx-b,cy-b);hx.lineTo(cx-a,cy-a);hx.moveTo(cx+b,cy-b);hx.lineTo(cx+a,cy-a);hx.moveTo(cx-b,cy+b);hx.lineTo(cx-a,cy+a);hx.moveTo(cx+b,cy+b);hx.lineTo(cx+a,cy+a);hx.stroke();
    hx.textAlign='center';hx.font=F(12);hx.fillStyle='#ffffff';hx.fillText('HIT',cx,cy+20*u);}
  hx.font=F(11);
  const LT=S.lockT;
  for(const e of enemies){
    if(!e.alive||!e.onScreen)continue;
    const locked=lockedList.includes(e),s=(locked?11:7+(1-Math.min(1,e.lock/LT))*14)*u;
    hx.strokeStyle=locked?HR:e.target?HA:'rgba(158,240,124,.8)';
    if(e.lock>0||locked){hx.strokeRect(e.sx-s,e.sy-s,s*2,s*2);}
    else{hx.beginPath();hx.moveTo(e.sx,e.sy-6*u);hx.lineTo(e.sx+6*u,e.sy);hx.lineTo(e.sx,e.sy+6*u);hx.lineTo(e.sx-6*u,e.sy);hx.closePath();hx.stroke();}
    hx.textAlign='center';
    if(locked){hx.fillStyle=HR;hx.fillText('LOCK',e.sx,e.sy+s+2*u);}
    else if(e.target){hx.fillStyle=HA;hx.fillText('TARGET',e.sx,e.sy+s+2*u);}
    if(e===rifleT){hx.strokeStyle=HA;hx.beginPath();hx.arc(e.sx,e.sy,s+5*u,0,Math.PI*2);hx.stroke();}
    if(e.lock>0||locked||e===rifleT){hx.fillStyle='rgba(158,240,124,.25)';hx.fillRect(e.sx-14*u,e.sy-s-8*u,28*u,3*u);hx.fillStyle=HG;hx.fillRect(e.sx-14*u,e.sy-s-8*u,28*u*Math.max(0,e.hp/e.max),3*u);}
  }
  const enc=P.over?HR:HA;
  hx.textAlign='center';hx.fillStyle=enc;hx.font=F(12);hx.fillText(P.over?'ENERGY ── 回復中':'ENERGY',w/2,h-48*u);
  bar(w/2-120*u,h-32*u,240*u,10*u,P.en/P.enMax,enc);
  hx.textAlign='right';
  const handHud=(lab,W,st,yl,yn)=>{if(!W||W.id==='LB-0')return;hx.font=F(13);
    if(isBlade(W)){const rdy=st.cd<=0&&!P.over;hx.fillStyle=rdy?HC:'rgba(127,216,255,.45)';hx.fillText(lab+'  '+W.hud,w-16*u,h-yl*u);hx.font=F(18);hx.fillText(rdy?'READY':'-----',w-16*u,h-yn*u);}
    else{hx.fillStyle=(W.en?!P.over:st.ammo>0)?(W.en?HC:HG):HR;hx.fillText(lab+'  '+W.hud,w-16*u,h-yl*u);hx.font=F(22);hx.fillText(W.en?'EN':String(st.ammo).padStart(3,'0'),w-16*u,h-yn*u);}};
  handHud('L',S.lw,P.hands.L,150,134);handHud('R',S.r,P.hands.R,104,88);
  hx.font=F(13);
  if(S.b.kind==='radar'){hx.fillStyle=HC;hx.fillText('B  '+S.b.hud,w-16*u,h-48*u);}
  else{hx.fillStyle=(S.b.en?!P.over:P.msl>0)?(P.mslCd>0?'rgba(158,240,124,.5)':S.b.en?HC:HG):HR;
    hx.fillText('B  '+S.b.hud+(lockedList.length?' ×'+lockedList.length:''),w-16*u,h-48*u);
    hx.font=F(22);hx.fillText(S.b.en?'EN':String(P.msl).padStart(S.b.ammo>99?3:2,'0'),w-16*u,h-32*u);}
  hx.textAlign='left';hx.font=F(12);hx.fillStyle=HG;
  hx.fillText('SPD '+String(Math.round(Math.hypot(P.vel.x,P.vel.z)*12)).padStart(3,'0')+' km/h',cx-bw,cy+bh+8*u);
  hx.textAlign='right';hx.fillText('ALT '+String(Math.round(P.pos.y*2)).padStart(3,'0')+' m',cx+bw,cy+bh+8*u);
  // objective
  hx.textAlign='left';hx.font=F(13);hx.fillStyle=HG;const m=curM;let oy=14*u;
  const ot=m.obj==='targets'?`目標：砲台 残り ${objRemain()}`:m.obj==='boss'?`目標：敵AC 撃破`:m.obj==='defend'?`目標：施設防衛　第${Math.max(1,waveIdx)}波 / ${m.waves.length}`:`目標：敵勢力 残り ${objRemain()}`;
  hx.fillText(ot,16*u,oy);oy+=18*u;
  if(m.limit){const left=m.limit-missionT;hx.fillStyle=left<30&&Math.floor(time*2)%2?HR:left<30?HA:HG;hx.fillText('LIMIT '+mmss(left),16*u,oy);}
  else hx.fillText('TIME '+mmss(missionT),16*u,oy);
  oy+=20*u;
  if(GEN){hx.fillStyle=GEN.flash>0?'#fff':HC;hx.font=F(11);hx.fillText('発電施設',16*u,oy);bar(70*u,oy+2*u,110*u,7*u,GEN.hp/GEN.max,GEN.hp/GEN.max<0.3?HR:HC);}
  const bs=enemies.find(e=>e.isBoss&&e.alive);
  if(bs){hx.textAlign='center';hx.fillStyle=HR;hx.font=F(12);hx.fillText(bs.cfg.name,w/2,58*u);bar(w/2-130*u,74*u,260*u,6*u,bs.hp/bs.max,HR);}
  // radar
  const rr=56*u,rx=16*u+rr,ry=h-16*u-rr,RANGE=S.radar;
  hx.fillStyle='rgba(10,20,8,.45)';hx.beginPath();hx.arc(rx,ry,rr,0,Math.PI*2);hx.fill();
  hx.strokeStyle='rgba(158,240,124,.5)';hx.beginPath();hx.arc(rx,ry,rr,0,Math.PI*2);hx.stroke();
  hx.beginPath();hx.arc(rx,ry,rr/2,0,Math.PI*2);hx.stroke();
  const fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw),gx=Math.cos(P.yaw),gz=-Math.sin(P.yaw);
  const rp=(x,z)=>{const dx=x-P.pos.x,dz=z-P.pos.z;let lx=(dx*gx+dz*gz)/RANGE,ly=-(dx*fx+dz*fz)/RANGE;const L=Math.hypot(lx,ly);if(L>1){lx/=L;ly/=L;}return [rx+lx*rr,ry+ly*rr];};
  if(GEN){const [x,y]=rp(GEN.pos.x,GEN.pos.z);hx.fillStyle=HC;hx.fillRect(x-4*u,y-4*u,8*u,8*u);}
  for(const e of enemies){if(!e.alive)continue;const [x,y]=rp(e.pos.x,e.pos.z);
    hx.fillStyle=e.isBoss||e.target?HA:HR;const s=(e.isBoss?4:3)*u;hx.fillRect(x-s,y-s,s*2,s*2);}
  for(const s of shots){if(!s.foe||s.kind!=='m')continue;const [x,y]=rp(s.p.x,s.p.z);hx.fillStyle='#fff';hx.fillRect(x-1.5*u,y-1.5*u,3*u,3*u);}
  hx.fillStyle=HG;hx.beginPath();hx.moveTo(rx,ry-5*u);hx.lineTo(rx+4*u,ry+4*u);hx.lineTo(rx-4*u,ry+4*u);hx.closePath();hx.fill();
  if(msg.time>0){hx.textAlign='center';hx.font=F(16);hx.fillStyle=msg.c;if(msg.time>0.3||Math.floor(time*10)%2)hx.fillText(msg.t,w/2,cy-bh-34*u);}
  if(shots.some(s=>s.foe&&s.kind==='m')&&Math.floor(time*4)%2){hx.textAlign='center';hx.font=F(14);hx.fillStyle=HR;hx.fillText('▲ MISSILE ▲',w/2,cy+bh+28*u);}
  if(P.ap/P.max<0.3&&P.alive&&Math.floor(time*2)%2){hx.textAlign='center';hx.font=F(13);hx.fillStyle=HR;hx.fillText('AP 低下',w/2,52*u+(bs?36*u:0));}
  if(lockFailed&&missionT<6&&!isTouch){hx.textAlign='center';hx.font=F(11);hx.fillStyle=HA;hx.fillText('マウスを画面内で動かして旋回できます',w/2,h-70*u);}
}

/* ================= loop ================= */
let last=performance.now(),clock=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,(now-last)/1000);last=now;clock+=dt;
  pollPad(dt);
  if(state==='play'){
    applyLook(dt);updatePlayer(dt);updateEnemies(dt,clock);updateShots(dt);updateMission(dt);
    updateCamera(dt);updateLocks(dt);
    hitFlash=Math.max(0,hitFlash-dt*1.5);hitMark-=dt;msg.time-=dt;warnT-=dt;
  }else if(state==='title'||state==='boot'||state==='hub'){
    const hubOn=state==='hub',wide=innerWidth>760;
    const a=clock*(hubOn?0.28:0.16),R=hubOn?12:14;
    camera.position.set(Math.sin(a)*R,hubOn?5:4.2,Math.cos(a)*R);
    const look=new V3(0,3.5,0);
    if(wide){look.add(new V3(Math.cos(a),0,-Math.sin(a)).multiplyScalar(hubOn?-4.5:4.5));}
    else if(hubOn)look.y-=2.8;
    camera.lookAt(look);
    P.mech.g.rotation.y=0;P.mech.slashR=P.mech.slashL=0;animMech(P.mech,0,true,dt,0.1,false);
  }
  for(const b of blinkers)b.visible=Math.floor(clock*1.6+b.position.x)%2===0;
  if(state!=='paused'){
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;
      if(p.life<=0){scene.remove(p.m);p.m.material.dispose();parts.splice(i,1);continue;}
      p.v.y-=p.grav*dt;p.m.position.addScaledVector(p.v,dt);if(p.grav&&p.m.position.y<0.1){p.m.position.y=0.1;p.v.set(0,0,0);}
      if(p.grow){p.s+=p.grow*dt;p.m.scale.setScalar(p.s);}
      p.m.material.opacity=p.base*Math.min(1,p.life/p.max*1.4);
      p.m.rotation.x+=dt*3;p.m.rotation.y+=dt*2;}
  }
  renderer.render(scene,camera);drawHUD(clock);
}
loadMap('hangar');rebuildPlayer();openTitle();
requestAnimationFrame(loop);
})();
